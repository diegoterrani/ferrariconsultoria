<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Ferrari Consultoria">
  <!--
    Favicon = ícone-arco isolado, tile vinho-noite + traço ouro-brilhante —
    exatamente a combinação que o documento de marca (identidade_visual.html,
    "Ícone / avatar") especifica pra este uso ("avatar circular pequeno e
    ícone de aplicativo, onde a logomarca completa não cabe"). Path SVG
    copiado literal do documento fonte, não redesenhado — é a "vetorização
